name: Keeper Tailscale Auto-Runner
on:
  workflow_dispatch:
    inputs:
      authkey:
        description: 'Tailscale Auth Key'
        required: true
        default: ''

jobs:
  run-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Tailscale Multi-Tier Engine & Tools
        run: |
          set -e
          AUTH="${{ github.event.inputs.authkey }}"
          
          echo "==> [1/3] Installing Tailscale..."
          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh || (sudo apt-get update -y && sudo apt-get install -y tailscale)
          fi

          echo "==> [2/3] Authenticating Tailscale Node..."
          sudo tailscale up --authkey="${AUTH}" --hostname="gh-${{ github.repository_owner }}" --accept-routes --reset || {
            echo "Falling back to userspace networking mode..."
            sudo tailscaled --tun=userspace-networking >/dev/null 2>&1 &
            sleep 2
            sudo tailscale up --authkey="${AUTH}" --hostname="gh-${{ github.repository_owner }}" --accept-routes --reset
          }

          echo "==> [3/3] Installing Essential Libraries..."
          sudo apt-get update -y
          sudo apt-get install -y python3-pip git htop build-essential curl wget
          pip install --no-cache-dir psutil aiohttp requests

      - name: Keep Node Alive & Monitor
        run: |
          tailscale ip -4 || true
          tailscale status || true
