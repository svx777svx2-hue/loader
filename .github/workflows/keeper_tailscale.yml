name: Keeper Tailscale Codespace Helper
on:
  workflow_dispatch:

jobs:
  tailscale-codespace-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          tailscale version

      - name: Generate device authorization URL from tailscale up output
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/tailscale
          sudo tailscaled \\
            --tun=userspace-networking \\
            --socket=/tmp/tailscale/tailscaled.sock \\
            >/tmp/tailscale/tailscaled.log 2>&1 &
          for i in {1..30}; do
            sudo test -S /tmp/tailscale/tailscaled.sock && break
            sleep 1
          done
          sudo test -S /tmp/tailscale/tailscaled.sock

          echo "==> Running interactive Tailscale login..."
          set +e
          sudo tailscale --socket=/tmp/tailscale/tailscaled.sock up \\
            --accept-dns=false \\
            --hostname="codespace-${GITHUB_REPOSITORY_OWNER}-${GITHUB_REPOSITORY##*/}" 2>&1 | tee /tmp/tailscale/up-output.txt
          UP_RC=${PIPESTATUS[0]}
          set -e

          echo "==> Tailscale command exit code: ${UP_RC}"
          echo "==> Raw tailscale up output follows:"
          cat /tmp/tailscale/up-output.txt || true

          URL=$(grep -Eo 'https://login\\.tailscale\\.com/a/[A-Za-z0-9_-]+' /tmp/tailscale/up-output.txt | head -n 1 || true)
          if [ -z "$URL" ]; then
            URL=$(grep -Eo 'https://login\\.tailscale\\.com/a/[A-Za-z0-9_-]+' /tmp/tailscale/tailscaled.log | head -n 1 || true)
          fi

          if [ -n "$URL" ]; then
            echo ":::TAILSCALE_LOGIN_URL:::${URL}:::END:::"
            echo "Tailscale authorization URL: ${URL}"
          else
            echo "No Tailscale authorization URL was emitted by tailscale up."
            exit ${UP_RC:-1}
          fi
