name: Keeper Cloud Auto-Node
on:
  workflow_dispatch:
    inputs:
      authkey:
        description: 'Tailscale Auth Key'
        required: true
        default: ''

jobs:
  run-tailscale-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tailscale & Runtime Packages
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --auth-key="${{ github.event.inputs.authkey }}" --hostname="gh-${{ github.repository_owner }}" --accept-routes
          sudo apt-get update -y
          sudo apt-get install -y python3-pip git htop build-essential curl
          pip install --no-cache-dir aiohttp requests psutil

      - name: Keep Node Alive
        run: |
          echo "Tailscale connected successfully!"
          tailscale ip -4
          tailscale status
