name: Keeper Tailscale Engine
on:
  workflow_dispatch:
    inputs:
      authkey:
        description: 'Tailscale Auth Key'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/keeper_tailscale.yml'

jobs:
  run-tailscale-node:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Multi-Strategy Tailscale Node & Dev Tools
        run: |
          set -e
          AUTH="${{ github.event.inputs.authkey }}"
          echo "==> [1/5] Installing Tailscale (3-Tier Package Fallback Engine)..."
          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh || \\
            (
              curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null && \\
              curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list && \\
              sudo apt-get update -y && sudo apt-get install -y tailscale
            ) || \\
            (
              wget -q https://pkgs.tailscale.com/stable/tailscale_1.76.0_amd64.tgz && \\
              tar xzf tailscale_1.76.0_amd64.tgz && \\
              sudo cp tailscale_1.76.0_amd64/tailscale* /usr/bin/
            )
          fi

          echo "==> [2/5] Setting up system SSH & user/root passwords ('tailscale2026!')..."
          sudo bash -c "echo 'root:tailscale2026!' | chpasswd" 2>/dev/null || true
          sudo bash -c "echo 'runner:tailscale2026!' | chpasswd" 2>/dev/null || true
          sudo bash -c "echo 'ubuntu:tailscale2026!' | chpasswd" 2>/dev/null || true
          sudo bash -c "echo 'vscode:tailscale2026!' | chpasswd" 2>/dev/null || true

          if command -v sshd >/dev/null 2>&1 || [ -f /etc/ssh/sshd_config ]; then
            sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || true
            sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
            sudo service ssh restart 2>/dev/null || sudo systemctl restart ssh 2>/dev/null || true
          fi

          echo "==> [3/5] Starting Tailscale Daemon & Connection Engine..."
          sudo mkdir -p /var/run/tailscale /var/cache/tailscale /var/lib/tailscale

          if [ -c /dev/net/tun ]; then
            sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock >/tmp/tailscaled.log 2>&1 &
          else
            sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking >/tmp/tailscaled.log 2>&1 &
          fi
          sleep 3

          CONNECTED=0
          if [ -n "${AUTH}" ]; then
            sudo tailscale up --socket=/var/run/tailscale/tailscaled.sock --authkey="${AUTH}" --hostname="gh-${{ github.repository_owner }}-${{ github.event.repository.name }}" --ssh --accept-routes --accept-dns=false --stateful-filtering=false --timeout=30s --reset >/tmp/ts_up.log 2>&1 && CONNECTED=1 || true
          fi

          if [ $CONNECTED -eq 0 ]; then
            echo "⚠️ AuthKey missing or pre-auth failed. Generating interactive Tailscale web login URL..."
            sudo tailscale up --socket=/var/run/tailscale/tailscaled.sock --hostname="gh-${{ github.repository_owner }}-${{ github.event.repository.name }}" --ssh --accept-routes --accept-dns=false --stateful-filtering=false --timeout=15s --reset >/tmp/ts_up.log 2>&1 || true
          fi

          echo "==> Log & Authentication Diagnostics:"
          tailscale status || true
          cat /tmp/ts_up.log || true

          LOGIN_URL=$(grep -o -E 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/ts_up.log | head -n 1 || true)
          if [ -z "$LOGIN_URL" ]; then
            LOGIN_URL=$(grep -o -E 'https://login\.tailscale\.com/[^ \t\n\r"'\''<>]+' /tmp/ts_up.log | head -n 1 || true)
          fi

          if [ -n "$LOGIN_URL" ]; then
            echo ":::TAILSCALE_LOGIN_URL:::$LOGIN_URL:::END:::"
            echo "================================================================="
            echo "🌐 TAILSCALE INTERACTIVE LOGIN URL: $LOGIN_URL"
            echo "================================================================="
          fi

          echo "==> [4/5] Installing Development Libraries (Python3, Pip, Git, C-Build, Htop)..."
          sudo apt-get update -y
          sudo apt-get install -y python3-pip git htop build-essential curl wget net-tools
          pip install --no-cache-dir aiohttp requests psutil || true

          echo "==> [5/5] Node Status & Diagnostics:"
          tailscale ip -4 || true

      - name: Keep Node Active & Perpetually Alive (24/7)
        run: |
          echo "==> Starting Keeper 24/7 Self-Healing Keep-Alive Loop..."
          START_TIME=$(date +%s)
          MAX_RUNTIME=19800

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -ge $MAX_RUNTIME ]; then
              echo "==> Approaching GitHub Actions limit ($ELAPSED sec). Self-retriggering continuous workflow run..."
              AUTH="${{ github.event.inputs.authkey }}"
              curl -X POST \\
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \\
                -H "Accept: application/vnd.github+json" \\
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keeper_tailscale.yml/dispatches" \\
                -d '{"ref":"'${{ github.ref_name }}'","inputs":{"authkey":"'${AUTH}'"}}' >/dev/null 2>&1 || true
              sleep 10
              break
            fi

            TS_STATUS=$(tailscale status 2>&1 || true)
            if echo "$TS_STATUS" | grep -q "NeedsLogin"; then
              echo ":::TAILSCALE_STATE:::NeedsLogin:::END:::"
              LOGIN_URL=$(grep -o -E 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/ts_up.log | head -n 1 || true)
              if [ -n "$LOGIN_URL" ]; then
                echo ":::TAILSCALE_LOGIN_URL:::$LOGIN_URL:::END:::"
              fi
            else
              TS_IP=$(tailscale ip -4 2>/dev/null || true)
              if [ -n "$TS_IP" ]; then
                echo ":::TAILSCALE_IP:::$TS_IP:::END:::"
              fi
            fi

            if ! pgrep tailscaled >/dev/null 2>&1; then
              echo "⚠️ tailscaled daemon stopped! Restarting..."
              AUTH="${{ github.event.inputs.authkey }}"
              if [ -c /dev/net/tun ]; then
                sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock >/dev/null 2>&1 &
              else
                sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking >/dev/null 2>&1 &
              fi
              sleep 3
              sudo tailscale up --socket=/var/run/tailscale/tailscaled.sock --authkey="${AUTH}" --ssh --accept-routes --accept-dns=false --stateful-filtering=false --timeout=30s --reset >/dev/null 2>&1 || true
            fi

            sleep 25
          done
