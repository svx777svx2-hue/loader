name: Keeper Tailscale Engine
on:
  workflow_dispatch:
    inputs:
      authkey:
        description: 'Tailscale Auth Key'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/keeper_tailscale.yml'

jobs:
  run-tailscale-node:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tailscale Node
        run: |
          AUTH="${{ github.event.inputs.authkey }}"
          HOSTNAME="gh-${{ github.repository_owner }}-${{ github.event.repository.name }}"

          echo "==> [1/5] Installing Tailscale via official script..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh 2>&1 || true

          if ! command -v tailscale >/dev/null 2>&1; then
            echo "==> install.sh failed, trying apt..."
            sudo apt-get update -qq 2>&1 || true
            sudo apt-get install -y tailscale 2>&1 || true
          fi

          tailscale version 2>&1 || { echo "FATAL: tailscale not installed"; exit 1; }

          echo "==> [2/5] SSH setup..."
          sudo bash -c "echo 'root:tailscale2026!' | chpasswd" 2>/dev/null || true
          sudo bash -c "echo 'runner:tailscale2026!' | chpasswd" 2>/dev/null || true
          sudo sed -i 's/#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sudo sed -i 's/#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sudo service ssh restart 2>/dev/null || sudo systemctl restart ssh 2>/dev/null || true

          echo "==> [3/5] Starting tailscaled daemon..."
          sudo mkdir -p /var/run/tailscale /var/cache/tailscale /var/lib/tailscale
          sudo pkill -9 tailscaled 2>/dev/null || true
          sleep 2
          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/var/run/tailscale/tailscaled.sock \
            --tun=userspace-networking \
            >/tmp/tailscaled.log 2>&1 &
          sleep 5
          echo "==> tailscaled PID: $(pgrep tailscaled || echo NONE)"

          echo "==> [4/5] Connecting to Tailscale..."
          CONNECTED=0
          LOGIN_URL=""

          if [ -n "${AUTH}" ]; then
            echo "==> Attempting connection with authkey..."
            sudo tailscale up \
              --socket=/var/run/tailscale/tailscaled.sock \
              --authkey="${AUTH}" \
              --hostname="${HOSTNAME}" \
              --ssh \
              --accept-routes \
              --accept-dns=false \
              --timeout=60s \
              --reset \
              2>&1 | tee /tmp/ts_up.log && CONNECTED=1 || true
            echo "==> authkey up result: CONNECTED=${CONNECTED}"
          fi

          if [ $CONNECTED -eq 0 ]; then
            echo "==> Getting login URL via tailscale login..."
            sudo tailscale login \
              --socket=/var/run/tailscale/tailscaled.sock \
              --hostname="${HOSTNAME}" \
              --timeout=5s \
              2>&1 | tee /tmp/ts_login.log || true

            LOGIN_URL=$(grep -oE 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/ts_login.log 2>/dev/null | head -1)

            if [ -z "$LOGIN_URL" ]; then
              sudo tailscale up \
                --socket=/var/run/tailscale/tailscaled.sock \
                --hostname="${HOSTNAME}" \
                --ssh \
                --accept-routes \
                --accept-dns=false \
                --timeout=10s \
                --reset \
                2>&1 | tee /tmp/ts_up.log || true
              LOGIN_URL=$(grep -oE 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/ts_up.log 2>/dev/null | head -1)
            fi

            if [ -z "$LOGIN_URL" ]; then
              LOGIN_URL=$(grep -oE 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/tailscaled.log 2>/dev/null | head -1)
            fi
          fi

          echo "--- ts_login.log ---"
          cat /tmp/ts_login.log 2>/dev/null || true
          echo "--- ts_up.log ---"
          cat /tmp/ts_up.log 2>/dev/null || true
          echo "--- tailscaled.log (last 30 lines) ---"
          tail -30 /tmp/tailscaled.log 2>/dev/null || true
          echo "--- tailscale status ---"
          sudo tailscale status --socket=/var/run/tailscale/tailscaled.sock 2>&1 || true

          if [ -n "$LOGIN_URL" ]; then
            echo ":::TAILSCALE_LOGIN_URL:::${LOGIN_URL}:::END:::"
            echo "================================================="
            echo "LOGIN URL: ${LOGIN_URL}"
            echo "================================================="
          else
            TS_IP=$(sudo tailscale ip -4 --socket=/var/run/tailscale/tailscaled.sock 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then
              echo ":::TAILSCALE_IP:::${TS_IP}:::END:::"
              echo "IP: ${TS_IP}"
            else
              echo ":::TAILSCALE_STATE:::check_manually:::END:::"
            fi
          fi

          echo "==> [5/5] Installing dev tools..."
          sudo apt-get install -y python3-pip git htop build-essential net-tools 2>&1 || true
          pip3 install --no-cache-dir aiohttp requests psutil 2>&1 || true
          echo "==> Setup complete!"

      - name: Keep Node Active 24/7
        run: |
          AUTH="${{ github.event.inputs.authkey }}"
          HOSTNAME="gh-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          echo "==> 24/7 Keep-Alive started."
          START_TIME=$(date +%s)
          MAX_RUNTIME=19800
          LOOP=0

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            LOOP=$((LOOP + 1))

            if [ $ELAPSED -ge $MAX_RUNTIME ]; then
              echo "==> Approaching 6h limit ($ELAPSED s). Self-retriggering..."
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keeper_tailscale.yml/dispatches" \
                -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"authkey\":\"${AUTH}\"}}" \
                >/dev/null 2>&1 || true
              sleep 10
              break
            fi

            if ! pgrep tailscaled >/dev/null 2>&1; then
              echo "==> tailscaled stopped! Restarting..."
              sudo tailscaled \
                --state=/var/lib/tailscale/tailscaled.state \
                --socket=/var/run/tailscale/tailscaled.sock \
                --tun=userspace-networking \
                >/dev/null 2>&1 &
              sleep 5
              if [ -n "${AUTH}" ]; then
                sudo tailscale up \
                  --socket=/var/run/tailscale/tailscaled.sock \
                  --authkey="${AUTH}" \
                  --hostname="${HOSTNAME}" \
                  --ssh --accept-routes --accept-dns=false \
                  --timeout=30s --reset \
                  >/dev/null 2>&1 || true
              fi
            fi

            TS_STATUS=$(sudo tailscale status --socket=/var/run/tailscale/tailscaled.sock 2>&1 || true)
            TS_IP=$(sudo tailscale ip -4 --socket=/var/run/tailscale/tailscaled.sock 2>/dev/null || true)

            if echo "$TS_STATUS" | grep -qi "NeedsLogin\|Logged out"; then
              echo ":::TAILSCALE_STATE:::NeedsLogin:::END:::"
              LOGIN_URL=$(grep -oE 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' /tmp/ts_login.log /tmp/ts_up.log /tmp/tailscaled.log 2>/dev/null | head -1 || true)
              if [ -n "$LOGIN_URL" ]; then
                echo ":::TAILSCALE_LOGIN_URL:::${LOGIN_URL}:::END:::"
              else
                NEWURL=$(sudo tailscale login --socket=/var/run/tailscale/tailscaled.sock --timeout=5s 2>&1 | grep -oE 'https://login\.tailscale\.com/a/[a-zA-Z0-9_-]+' | head -1 || true)
                [ -n "$NEWURL" ] && echo ":::TAILSCALE_LOGIN_URL:::${NEWURL}:::END:::"
              fi
            elif [ -n "$TS_IP" ]; then
              echo ":::TAILSCALE_IP:::${TS_IP}:::END:::"
            fi

            echo "==> Loop ${LOOP} | Elapsed ${ELAPSED}s | IP=${TS_IP:-none} | Status=$(echo "$TS_STATUS" | head -1)"
            sleep 30
          done
