name: Keeper Tailscale Engine
on:
  workflow_dispatch:
    inputs:
      authkey:
        description: 'Tailscale Auth Key'
        required: true
        default: ''

jobs:
  run-tailscale-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Multi-Strategy Tailscale Node & Dev Tools
        run: |
          set -e
          AUTH="${{ github.event.inputs.authkey }}"
          echo "==> [1/4] Installing Tailscale Official Package..."
          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh || (sudo apt-get update -y && sudo apt-get install -y tailscale)
          fi

          echo "==> [2/4] Starting Tailscale Daemon in Userspace..."
          sudo mkdir -p /var/run/tailscale /var/cache/tailscale /var/lib/tailscale && sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking >/dev/null 2>&1 & sleep 3 && sudo tailscale up --authkey="tskey-auth-kEyWUbgUnp11CNTRL-NsduTrTYbYBN2Ny4J4rdYBQk8rgAV6qN" --hostname="gh-{{ github.repository_owner }}" --accept-routes --accept-dns=false --reset

          echo "==> [3/4] Installing Development Libraries (Python3, Pip, Git, C-Build, Htop)..."
          sudo apt-get update -y
          sudo apt-get install -y python3-pip git htop build-essential curl wget net-tools
          pip install --no-cache-dir aiohttp requests psutil

          echo "==> [4/4] Node Status & Diagnostics:"
          tailscale ip -4 || true
          tailscale status || true

      - name: Keep Node Active & Online
        run: |
          echo "Keeper Node is actively running in the background. Keeping active..."
          for i in {1..720}; do
            if ! pgrep tailscaled >/dev/null; then
              echo "tailscaled daemon stopped."
              exit 1
            fi
            sleep 30
          done
